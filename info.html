<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>유주아빠의 족집게 정보편</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: night-sky header, sticky answer bar (tabs + OMR dots), single column exam paper, bottom action area, in-page modals */
:root{
  --bg:#F2F3F9; --surface:#FFFFFF; --ink:#171A33; --muted:#5B6084; --line:#DCDFEE;
  --accent:#3B4CC6; --accent-soft:#E5E8FB; --star:#C77A12; --star-soft:#FBEFD9;
  --ok:#17824F; --ok-soft:#DFF3E8; --bad:#C3364A; --bad-soft:#FBE3E7;
  --night:#121838; --night-ink:#EEF0FF; --night-muted:#A9AFD6; --ground:#2B3158;
  --moon-dark:#3A3F5C; --moon-lit:#F3D88A; --scrim:rgba(14,17,36,.55);
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1124; --surface:#171B36; --ink:#E8EAF8; --muted:#9CA1C6; --line:#2A2F56;
  --accent:#8F9CFF; --accent-soft:#232A5A; --star:#F0B24A; --star-soft:#3A2D12;
  --ok:#4CC98A; --ok-soft:#123224; --bad:#FF7D8F; --bad-soft:#3C1820;
  --night:#090C20; --night-ink:#EEF0FF; --night-muted:#A9AFD6; --ground:#22274A;
  --moon-dark:#30344F; --moon-lit:#F3D88A; --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1124; --surface:#171B36; --ink:#E8EAF8; --muted:#9CA1C6; --line:#2A2F56;
  --accent:#8F9CFF; --accent-soft:#232A5A; --star:#F0B24A; --star-soft:#3A2D12;
  --ok:#4CC98A; --ok-soft:#123224; --bad:#FF7D8F; --bad-soft:#3C1820;
  --night:#090C20; --night-ink:#EEF0FF; --night-muted:#A9AFD6; --ground:#22274A;
  --moon-dark:#30344F; --moon-lit:#F3D88A; --scrim:rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit}
button:focus-visible{outline:3px solid var(--star);outline-offset:2px}

.sky{background:var(--night);color:var(--night-ink);background-image:radial-gradient(1.5px 1.5px at 12% 30%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 28% 70%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 46% 18%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 63% 82%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 88% 40%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 74% 12%,#fff6 50%,transparent 51%)}
.sky .wrap{padding-block:26px 0;display:grid;gap:8px}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--night-muted);margin:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,8.5vw,48px);line-height:1.1;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--star)}
.level{justify-self:start;display:inline-flex;align-items:center;gap:6px;align-self:start;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--star);color:#1a1300}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid #ffffff2e;color:var(--night-ink);background:#ffffff10}
.tabs{display:flex;gap:4px;margin-top:10px}
.tab{font-weight:700;font-size:15px;padding:10px 20px;border-radius:12px 12px 0 0;border:0;background:#ffffff14;color:var(--night-muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:10px;display:grid;gap:8px}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.status b{color:var(--ink);font-size:17px}
.phase{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.phase.review{background:var(--star-soft);color:var(--star)}
.phase.done{background:var(--ok-soft);color:var(--ok)}
.omr{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:10.5px;font-weight:700;display:grid;place-items:center;cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.dot.on{background:var(--accent);border-color:var(--accent);color:#fff}

main .wrap{padding-block:16px 28px;display:grid;gap:14px}
.notice{margin:0;font-size:14px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;word-break:keep-all}
.notice.review{border-color:var(--star);color:var(--ink);background:var(--star-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:grid;gap:12px;min-width:0;scroll-margin-top:150px;transition:box-shadow .3s}
.card.flash{box-shadow:0 0 0 3px var(--bad)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.num{font-family:var(--display);font-size:22px;color:var(--ink);line-height:1}
.q{margin:0;font-weight:500;font-size:16.5px;word-break:keep-all}
.given{margin:0;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14.5px;word-break:keep-all}
.given hr{border:0;border-top:1px dashed var(--line);margin:8px 0}
.fig{display:grid;justify-items:center;gap:6px;overflow-x:auto}
.fig svg{width:100%;max-width:360px;height:auto}
.figrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.fig .figrow svg{width:calc(50% - 4px);max-width:190px;flex:none}
.figcap{margin:0;font-size:12px;color:var(--muted);text-align:center}
.opts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;font-size:15px;display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;word-break:keep-all}
.opt:hover{border-color:var(--accent)}
.opt .n{flex:none;font-weight:700;color:var(--muted)}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt[aria-pressed="true"] .n{color:var(--accent)}
.opt.static{cursor:default}
.opt.static:hover{border-color:var(--line)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .n{color:var(--ok)}
.opt.mine{background:var(--bad-soft);border-color:var(--bad)}
.opt.mine .n{color:var(--bad)}
.tag{margin-left:auto;flex:none;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;align-self:center}
.tag.r{background:var(--ok);color:#fff}
.tag.m{background:var(--bad);color:#fff}
.exp{display:grid;gap:10px}
.exp section{border-radius:12px;padding:12px 14px;font-size:14.5px;word-break:keep-all}
.exp h3{margin:0 0 4px;font-size:13.5px}
.exp .why{background:var(--ok-soft)} .exp .why h3{color:var(--ok)}
.exp .mine{background:var(--bad-soft)} .exp .mine h3{color:var(--bad)}
.exp .each{background:var(--bg)}
.exp .each ol{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.exp .each li{display:flex;gap:8px}
.exp .each li b{flex:none}
.exp .each li.ok b{color:var(--ok)}

.actions{display:grid;gap:10px;justify-items:center;padding-block:10px 4px}
.btn{font-weight:700;font-size:15px;padding:13px 22px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.submit{background:var(--bad);border-color:var(--bad);color:#fff;font-size:16.5px;padding:16px 26px;box-shadow:0 6px 18px -6px var(--bad)}
.btn.wide{width:100%;max-width:420px}

.result{background:var(--night);color:var(--night-ink);border-radius:20px;padding:24px 20px;display:grid;gap:8px;text-align:center;justify-items:center}
.result .big{font-family:var(--display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.result .big small{font-size:26px;color:var(--night-muted)}
.result p{margin:0;color:var(--night-muted)}
.result .msg{color:var(--night-ink);font-weight:700;font-size:17px}
.badge{font-family:var(--display);font-size:26px;color:#1a1300;background:var(--star);padding:4px 18px;border-radius:10px;transform:rotate(-4deg)}
.sec-h{font-family:var(--display);font-weight:400;font-size:22px;margin:10px 0 0;color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:24px 0}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding-block:0 32px}

.backdrop{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:20px;padding:24px 20px 18px;width:100%;max-width:380px;display:grid;gap:14px;text-align:center;box-shadow:0 20px 50px -12px rgba(0,0,0,.45)}
.modal .ico{justify-self:center;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.modal .ico.warn{background:var(--bad-soft);color:var(--bad)}
.modal .ico.star{background:var(--star-soft);color:var(--star)}
.modal h2{margin:0;font-size:19px;word-break:keep-all;text-wrap:balance}
.modal p{margin:0;font-size:15px;color:var(--muted);word-break:keep-all}
.modal .score{font-family:var(--display);font-size:54px;color:var(--ink);line-height:1}
.modal .btns{display:grid;gap:8px}
.hour{width:72px;height:72px;justify-self:center;color:var(--star)}
@media (prefers-reduced-motion:no-preference){
  .hour{animation:spin 0.9s cubic-bezier(.6,.1,.4,.9) infinite}
  .modal{animation:pop .2s ease-out}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}

.rain{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.rain span{position:absolute;top:-80px;font-family:var(--display);line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.18);animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(0) rotate(var(--r0))}100%{transform:translateY(calc(100vh + 120px)) rotate(var(--r1))}}
.stamp{position:fixed;left:50%;top:22%;transform:translate(-50%,0) rotate(-6deg);z-index:70;pointer-events:none;font-family:var(--display);font-size:72px;color:var(--star)}
</style>

<header class="sky">
  <div class="wrap">
    <p class="eyebrow">1학년 2학기 기말고사 대비</p>
    <h1>유주아빠의<br><em>족집게</em> 예상문제</h1>
    <div class="chips"><a class="chip" style="text-decoration:none;font-weight:700" href="./index.html">← 기본편</a><a class="chip" style="text-decoration:none;font-weight:700" href="./real.html">실전편</a></div><span class="level">정보편 · 실전</span>
    <div class="chips"><span class="chip">정보 · 11월 13일(금)</span></div>
  </div>
</header>

<div class="bar"><div class="wrap" id="bar"></div></div>
<main><div class="wrap" id="paper"></div></main>
<footer><div class="wrap">교과서와 학교 시험 범위를 바탕으로 유주아빠가 만든 예상문제야. 실제 기출문제는 아니야.<br>답안과 점수는 이 기기에만 저장돼.</div></footer>

const KEY=s=>"yuju-exam-"+SET.level+"-"+s;
function load(s){try{const v=JSON.parse(localStorage.getItem(KEY(s))||"null"); if(v&&v.ans) return v;}catch(e){} return {ans:{},phase:"solve",score:null};}
const ST={info:load("info")};
const cur="info";
const $=s=>document.querySelector(s);
const D=()=>SET[cur], S=()=>ST[cur];
function save(){try{localStorage.setItem(KEY(cur),JSON.stringify(S()))}catch(e){}}

function answered(){return D().q.filter(q=>S().ans[q.id]!==undefined).length;}
function renderBar(){
  const st=S(), n=answered(), total=D().q.length;
  const ph=st.phase==="graded"?`<span class="phase done">채점 완료 · ${st.score}점</span>`:st.phase==="review"?`<span class="phase review">검토 중</span>`:`<span class="phase">시험 보는 중</span>`;
  let h=`<div class="status"><span>${D().label} · 답한 문제 <b>${n}</b> / ${total}</span>${ph}</div>`;
  if(st.phase!=="graded") h+=`<div class="omr" aria-label="답안 표시판">`+D().q.map((q,i)=>`<button class="dot${st.ans[q.id]!==undefined?" on":""}" data-jump="${q.id}" aria-label="${i+1}번 ${st.ans[q.id]!==undefined?"답함":"아직 안 함"}">${i+1}</button>`).join("")+`</div>`;
  $("#bar").innerHTML=h;
}
function qHead(q,i){
  let h=`<div class="meta"><span class="num">${String(i+1).padStart(2,"0")}</span><span>${D().units[q.u].name}</span></div><p class="q">${q.q}</p>`;
  if(q.fig) h+=`<div class="fig">${FIGS[q.fig]}</div>`;
  if(q.g) h+=`<p class="given">${q.g}</p>`;
  return h;
}
function cardSolve(q,i){
  const sel=S().ans[q.id];
  return `<article class="card" id="c-${q.id}">${qHead(q,i)}<ul class="opts">`+q.o.map((t,j)=>`<li><button class="opt" data-q="${q.id}" data-p="${j}" aria-pressed="${sel===j}"><span class="n">${NUM[j]}</span><span>${t}</span></button></li>`).join("")+`</ul></article>`;
}
function cardReview(q,i){
  const mine=S().ans[q.id];
  let h=`<article class="card" id="c-${q.id}">${qHead(q,i)}<ul class="opts">`+q.o.map((t,j)=>{
    const c=j===q.a?" right":j===mine?" mine":"";
    const tag=j===q.a?'<span class="tag r">정답</span>':j===mine?'<span class="tag m">내 답</span>':"";
    return `<li><div class="opt static${c}"><span class="n">${NUM[j]}</span><span>${t}</span>${tag}</div></li>`;}).join("")+`</ul>`;
  h+=`<div class="exp"><section class="why"><h3>정답은 ${NUM[q.a]}번 · 이렇게 풀어</h3>${q.e}</section>`;
  if(mine!==undefined&&mine!==q.a) h+=`<section class="mine"><h3>내가 고른 ${NUM[mine]}번이 틀린 이유</h3>${q.w[mine]}</section>`;
  h+=`<section class="each"><h3>선지 하나씩 다시 보기</h3><ol>`+q.o.map((t,j)=>`<li class="${j===q.a?"ok":""}"><b>${NUM[j]}</b><span>${j===q.a?"정답이야. 위 풀이를 다시 읽어 봐.":q.w[j]}</span></li>`).join("")+`</ol></section></div></article>`;
  return h;
}
function renderPaper(){
  const st=S(), Q=D().q; let h="";
  if(st.phase==="graded"){
    const wrong=Q.filter(q=>st.ans[q.id]!==Q.find(x=>x.id===q.id).a);
    const ok=Q.length-wrong.length;
    h+=`<section class="result"><p>${D().label} ${SET.levelName} 결과</p>${st.score>=90?'<span class="badge">고수</span>':""}<div class="big">${st.score}<small>점</small></div><p class="msg">${Q.length}문제 중 ${ok}문제 정답</p><p>${wrong.length?"틀린 문제만 모아 뒀어. 해설을 꼼꼼히 읽어 보자.":"틀린 문제가 하나도 없어. 완벽해!"}</p></section>`;
    if(wrong.length){h+=`<h2 class="sec-h">틀린 문제 복습 (${wrong.length}문제)</h2>`; wrong.forEach(q=>{h+=cardReview(q,Q.indexOf(q));});}
    h+=`<div class="actions"><button class="btn wide" data-act="retry">처음부터 다시 풀기</button></div>`;
  }else{
    h+= st.phase==="review"
      ? `<p class="notice review">검토 시간이야. 1번부터 다시 한 번 천천히 훑어보자. 고칠 답이 있으면 지금 고쳐도 돼.</p>`
      : `<p class="notice">실제 시험처럼 풀어 봐. 답을 골라도 정답은 바로 나오지 않아. 다 풀면 맨 아래 [답안 확인하기]를 눌러.</p>`;
    Q.forEach((q,i)=>{h+=cardSolve(q,i);});
    h+= st.phase==="review"
      ? `<div class="actions"><button class="btn submit wide" data-act="submit">최종 답안 제출 + 채점하기</button></div>`
      : `<div class="actions"><button class="btn primary wide" data-act="check">답안 확인하기</button></div>`;
  }
  $("#paper").innerHTML=h;
}
function render(){renderBar();renderPaper();}

/* ---------- 팝업 ---------- */
let lastFocus=null;
function closeModal(){ $("#modal-root").innerHTML=""; document.body.style.overflow=""; if(lastFocus&&lastFocus.focus) try{lastFocus.focus({preventScroll:true})}catch(e){} }
function modal({icon="check",tone="",title="",msg="",score=null,buttons=[],spinner=false}){
  lastFocus=document.activeElement;
  const ico=spinner?ICON.hour:`<div class="ico ${tone}">${ICON[icon]}</div>`;
  $("#modal-root").innerHTML=`<div class="backdrop"><div class="modal" role="${buttons.length?"alertdialog":"status"}" aria-modal="true" aria-labelledby="m-t">${ico}${score!==null?`<div class="score">${score}점</div>`:""}<h2 id="m-t">${title}</h2>${msg?`<p>${msg}</p>`:""}${buttons.length?`<div class="btns">${buttons.map((b,i)=>`<button class="btn ${b.kind||""}" data-mb="${i}">${b.label}</button>`).join("")}</div>`:""}</div></div>`;
  document.body.style.overflow="hidden";
  const root=$("#modal-root");
  root.querySelectorAll("[data-mb]").forEach(el=>el.addEventListener("click",()=>{const b=buttons[+el.dataset.mb]; closeModal(); b.onClick&&b.onClick();}));
  const first=root.querySelector("[data-mb]"); if(first) first.focus();
}
document.addEventListener("keydown",e=>{ if(e.key==="Tab"&&$("#modal-root").innerHTML){ const f=[...$("#modal-root").querySelectorAll("button")]; if(!f.length){e.preventDefault();return;} const i=f.indexOf(document.activeElement); if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus();} else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus();} }});

const reduce=()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}};
function toTop(){window.scrollTo({top:0,behavior:reduce()?"auto":"smooth"});}

/* ---------- 고수 세레모니 ---------- */
function ceremony(){
  const box=document.createElement("div"); box.className="rain"; box.setAttribute("aria-hidden","true");
  if(reduce()){ box.innerHTML='<div class="stamp">고수</div>'; }
  else{
    const colors=["var(--star)","var(--accent)","var(--bad)","var(--ok)","var(--moon-lit)"];
    for(let i=0;i<48;i++){
      const s=document.createElement("span"); s.textContent="고수";
      const size=20+Math.random()*48;
      s.style.left=(Math.random()*96)+"%"; s.style.fontSize=size+"px"; s.style.color=colors[i%colors.length];
      s.style.animationDuration=(2.4+Math.random()*2)+"s"; s.style.animationDelay=(Math.random()*1.8)+"s";
      s.style.setProperty("--r0",(Math.random()*40-20)+"deg"); s.style.setProperty("--r1",(Math.random()*120-60)+"deg");
      box.appendChild(s);
    }
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(),6500);
}

/* ---------- 시험 흐름 ---------- */
function onCheck(){
  const Q=D().q, st=S(), miss=Q.map((q,i)=>[q,i]).filter(([q])=>st.ans[q.id]===undefined);
  if(miss.length){
    modal({icon:"warn",tone:"warn",title:"아직 답하지 않은 문제가 있어요",msg:MSG.unanswered+`<br><b style="color:var(--bad)">${miss.map(([,i])=>(i+1)+"번").join(", ")}</b>`,buttons:[{label:"확인",kind:"primary",onClick:()=>jumpTo(miss[0][0].id,true)}]});
    return;
  }
  modal({icon:"check",title:"모든 문제에 답을 입력했어요",msg:MSG.allDone,buttons:[{label:"확인",kind:"primary",onClick:()=>{st.phase="review";save();render();toTop();}}]});
}
function onSubmit(){
  modal({icon:"eye",tone:"star",title:MSG.confirm,buttons:[
    {label:"예",kind:"primary",onClick:grade},
    {label:"아니오 - 다시 한 번 훑어보기",onClick:toTop}]});
}
function grade(){
  modal({spinner:true,title:MSG.grading});
  setTimeout(()=>{
    const Q=D().q, st=S(); const ok=Q.filter(q=>st.ans[q.id]===q.a).length;
    st.score=Math.round(ok*100/Q.length); st.phase="graded"; save();
    closeModal();
    if(st.score>=90) ceremony();
    const allRight=ok===Q.length;
    modal({icon:"pen",tone:st.score>=90?"star":"",score:st.score,title:allRight?`${st.score}점입니다. 틀린 문제가 하나도 없어요!`:`${st.score}점입니다. 틀린 문제를 복습해 볼까요?`,
      buttons:[{label:allRight?"확인":"예",kind:"primary",onClick:()=>{render();toTop();}}]});
  },3000);
}
function onRetry(){
  modal({icon:"warn",tone:"warn",title:"처음부터 다시 풀까요?",msg:`${D().label} ${SET.levelName}의 답과 점수가 지워져요.`,buttons:[
    {label:"다시 풀기",kind:"primary",onClick:()=>{ST[cur]={ans:{},phase:"solve",score:null};save();render();toTop();}},
    {label:"취소"}]});
}
function jumpTo(id,flash){
  const el=document.getElementById("c-"+id); if(!el) return;
  el.scrollIntoView({behavior:reduce()?"auto":"smooth",block:"start"});
  if(flash){el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1800);}
}

document.addEventListener("click",ev=>{
  if(ev.target.closest("#modal-root")) return;
  const b=ev.target.closest("button"); if(!b) return;
  if(b.dataset.jump){ jumpTo(b.dataset.jump,false); return; }
  if(b.dataset.q){
    const st=S(); if(st.phase==="graded") return;
    st.ans[b.dataset.q]=+b.dataset.p; save();
    b.closest(".opts").querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed",String(o===b)));
    renderBar(); return;
  }
  const act=b.dataset.act;
  if(act==="check") onCheck(); else if(act==="submit") onSubmit(); else if(act==="retry") onRetry();
});
render();
</script>

</body>
