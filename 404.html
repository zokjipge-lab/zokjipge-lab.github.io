<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<base href="/">
<title>유주아빠의 족집게 · 페이지 찾는 중</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2F3F9; --surface:#FFFFFF; --ink:#171A33; --muted:#5B6084; --line:#DCDFEE;
  --accent:#3B4CC6; --accent-soft:#E5E8FB; --star:#C77A12; --star-soft:#FBEFD9;
  --bad:#C3364A; --bad-soft:#FBE3E7;
  --night:#121838; --night-ink:#EEF0FF; --night-muted:#A9AFD6; --scrim:rgba(14,17,36,.55);
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1124; --surface:#171B36; --ink:#E8EAF8; --muted:#9CA1C6; --line:#2A2F56;
  --accent:#8F9CFF; --accent-soft:#232A5A; --star:#F0B24A; --star-soft:#3A2D12;
  --bad:#FF7D8F; --bad-soft:#3C1820; --night:#090C20; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2;margin:0;word-break:keep-all}
p{margin:0;color:var(--muted);word-break:keep-all}
code{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px;word-break:break-all}
.go{display:grid;gap:8px;padding:16px;border-radius:16px;background:var(--accent-soft);border:1px solid var(--accent)}
.go b{font-size:17px}
.go a{color:var(--accent);font-weight:700}
.h2{font-size:14px;font-weight:700;color:var(--muted);margin:8px 2px 0}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:inherit;text-decoration:none;min-height:60px}
.item:hover{border-color:var(--accent)}
.item .t{flex:1;display:grid;gap:2px}
.item b{font-size:16px}
.item small{font-size:12.5px;color:var(--muted)}
.item .badge{flex:none;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.badge.today{background:var(--bad);color:#fff}
.badge.soon{background:var(--star-soft);color:var(--star)}
.badge.later{background:var(--accent-soft);color:var(--accent)}
.badge.past{background:var(--line);color:var(--muted)}
.item.pick{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
a:focus-visible{outline:3px solid var(--star);outline-offset:2px}
</style>
</head>
<body>
<script src="/nav.js"></script>
<main id="box">
  <h1>페이지를 찾고 있어…</h1>
</main>
<script>
(function(){
  var box=document.getElementById("box");
  if(!window.ZK){ // 메뉴 파일을 못 불러온 경우에도 길은 알려주기
    box.innerHTML='<h1>앗, 주소가 조금 틀렸나봐</h1><p><a href="/">족집게 첫 화면으로 가기</a></p>';
    return;
  }
  var r=ZK.match(location.pathname);
  var tail=location.search+location.hash;
  if(r.sure&&r.page){
    box.innerHTML='<h1>'+r.page.name+' 페이지로 이동 중…</h1><p>바로 안 넘어가면 <a href="/'+r.page.file+'">여기를 눌러줘</a>.</p>';
    location.replace("/"+r.page.file+tail);
    return;
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function item(p,pick){
    var st=ZK.status(p.date);
    return '<li><a class="item'+(pick?' pick':'')+'" href="/'+p.file+'"><span class="t"><b>'+esc(p.name)+'</b><small>'+esc(ZK.dateLabel(p.date)+' · '+p.sub)+'</small></span><span class="badge '+st.key+'">'+st.text+'</span></a></li>';
  }
  var cand=r.candidates.slice(0,3);
  var html='<h1>앗, 주소가 조금 틀렸나봐</h1>'+
    '<p>입력한 주소 <code>'+esc(decodeURIComponent(location.pathname))+'</code> 에는 문제가 없어. 아래에서 골라줘.</p>';
  if(cand.length){
    html+='<div class="go"><b>혹시 이거 찾았어?</b><ul class="list">'+cand.map(function(p){return item(p,true)}).join("")+'</ul></div>';
  }
  html+='<p class="h2">전체 문제</p><ul class="list">'+ZK.PAGES.slice().sort(function(a,b){
    var pa=ZK.status(a.date).key==="past",pb=ZK.status(b.date).key==="past";
    if(pa!==pb)return pa?1:-1; return a.date<b.date?-1:a.date>b.date?1:0;
  }).map(function(p){return item(p,false)}).join("")+'</ul>';
  box.innerHTML=html;
  document.title="유주아빠의 족집게 · 주소를 다시 골라줘";
})();
</script>
</body>
</html>
